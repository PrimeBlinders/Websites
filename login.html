<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            padding-top: inherit;
        }
        .button-group button {
            width: 48%;
            padding: 10px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .button-group button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="signUpForm" style="display:none;">
        <h2>Sign Up</h2>
        <div class="form-group">
            <label for="usernameSignUp">Username</label>
            <input type="text" id="usernameSignUp" placeholder="Enter Username">
        </div>
        <div class="form-group">
            <label for="passwordSignUp">Password</label>
            <input type="password" id="passwordSignUp" placeholder="Enter Password">
        </div>
        <div class="form-group">
            <label for="contactSignUp">Contact</label>
            <input type="text" id="contactSignUp" placeholder="Enter Contact">
        </div>
        <div class="form-group">
            <label for="emailSignUp">Email</label>
            <input type="email" id="emailSignUp" placeholder="Enter Email">
        </div>
        <button onclick="signUp()">Sign Up</button>
    </div>

    <div id="loginForm" style="display:block;">
        <h2>Login</h2>
        <div class="form-group">
            <label for="usernameLogin">Username</label>
            <input type="text" id="usernameLogin" placeholder="Enter Username">
        </div>
        <div class="form-group">
            <label for="passwordLogin">Password</label>
            <input type="password" id="passwordLogin" placeholder="Enter Password">
        </div>
        <button onclick="login()">Login</button>
    </div>

    <div class="button-group">
        <button onclick="showSignUp()">Sign Up</button>
        <button onclick="showLogin()">Login</button>
    </div>
</div>

<script>
    function showSignUp() {
        document.getElementById('signUpForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
    }

    function showLogin() {
        document.getElementById('signUpForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
    }

    function signUp() {
        alert("Sign Up function to be implemented.");
        // Implement sign up functionality with Firebase or other backend here
    }

    function login() {
        // Implement login functionality with Firebase or other backend here
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
